<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work | Justin Close Media</title>
  <meta name="description" content="Hotel photography portfolio: interiors, lifestyle, property and drone work by Justin Close Media.">
  <meta property="og:title" content="Work | Justin Close Media">
  <meta property="og:image" content="images/portfolio/oceanfront-hotel-pool-dusk.jpg">
  <script>
    document.documentElement.classList.add('js');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('reduced');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="work">
  <a class="skip" href="#main">Skip to content</a>

  <div class="wipe" aria-hidden="true"></div>
  <div class="cursor" aria-hidden="true"><span>View</span></div>

  <header class="header">
    <a class="logo" href="index.html">Justin Close Media</a>
    <button class="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="work.html" aria-current="page">Work</a>
      <a href="index.html#drone">Drone</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main id="main">
    <section class="page-head wrap">
      <p class="eyebrow muted" data-reveal>Portfolio</p>
      <div class="page-head__row" style="margin-top:20px">
        <h1 class="display">
          <span class="line"><span>The <em>work.</em></span></span>
        </h1>
        <div class="filters" id="filters" role="group" aria-label="Filter by category" data-reveal>
          <!-- Filter buttons are added from js/photos.js -->
        </div>
      </div>
    </section>

    <section class="wrap">
      <div class="grid" id="grid">
        <!-- Photos are added from js/photos.js -->
      </div>
    </section>

    <section class="dark section wrap cta-band">
      <p class="eyebrow muted" data-reveal>Next</p>
      <h2 class="h2">
        <span class="line"><span>Your property</span></span>
        <span class="line"><span>could be <em>here.</em></span></span>
      </h2>
      <a class="btn" href="index.html#contact" data-reveal>Start an inquiry <span aria-hidden="true">→</span></a>
    </section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="lightbox__top">
      <span id="lb-count"></span>
      <button id="lb-close">Close ✕</button>
    </div>
    <div class="lightbox__stage"><img id="lb-img" alt=""></div>
    <div class="lightbox__bottom">
      <span id="lb-title" class="serif" style="font-size:20px"></span>
      <div class="lightbox__nav">
        <button id="lb-prev">← Prev</button>
        <button id="lb-next">Next →</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p class="footer__word" aria-hidden="true">Justin Close Media</p>
    <div class="footer__row">
      <span>© <span data-year></span> Justin Close Media</span>
      <a href="mailto:justinclosemedia@gmail.com">justinclosemedia@gmail.com</a>
      <a href="#main">Back to top ↑</a>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
